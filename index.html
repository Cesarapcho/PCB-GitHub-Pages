<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor 3D de PCB</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #101827; color: #f8fafc; font-family: Arial, sans-serif; }
    #viewer { position: fixed; inset: 0; }
    canvas { display: block; }
    .panel {
      position: fixed; z-index: 2; top: 18px; left: 18px;
      padding: 14px 17px; max-width: min(420px, calc(100vw - 36px));
      border: 1px solid #334155; border-radius: 12px;
      background: rgba(15, 23, 42, .90); backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }
    h1 { font-size: 18px; margin: 0 0 7px; }
    #status { margin: 0; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
    .help { margin-top: 9px; color: #94a3b8; font-size: 12px; line-height: 1.5; }
    #error { color: #fca5a5; overflow-wrap: anywhere; }
    .spinner { display: inline-block; width: 11px; height: 11px; margin-right: 7px;
      border: 2px solid #64748b; border-top-color: #38bdf8; border-radius: 50%;
      animation: spin .8s linear infinite; vertical-align: -1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 600px) { .panel { top: 10px; left: 10px; padding: 11px 13px; } h1 { font-size: 16px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <section class="panel">
    <h1>Modelo 3D de la PCB</h1>
    <p id="status"><span class="spinner"></span>Cargando el motor CAD y el archivo STEP…</p>
    <p class="help">Mouse: arrastrar para girar · Rueda para zoom · Clic derecho para desplazar</p>
    <p class="help" id="error"></p>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const status = document.getElementById('status');
    const errorBox = document.getElementById('error');
    const viewer = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101827);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.001, 1e9);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewer.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;

    scene.add(new THREE.AmbientLight(0xffffff, 1.3));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(1, -1, 2);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
    fillLight.position.set(-1, 1, 1);
    scene.add(fillLight);

    function toArray(value) {
      if (Array.isArray(value) || ArrayBuffer.isView(value)) return value;
      return null;
    }

    function makeMesh(source, meshNumber) {
      const positionArray = toArray(source?.attributes?.position?.array);
      if (!positionArray || positionArray.length < 9 || positionArray.length % 3 !== 0) {
        console.warn(`Malla ${meshNumber} omitida: atributo position no válido.`, source);
        return null;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positionArray, 3));

      // Algunas mallas pueden incluir el objeto normal, pero no su array.
      // Solo lo usamos si realmente contiene datos válidos.
      const normalArray = toArray(source?.attributes?.normal?.array);
      if (normalArray && normalArray.length === positionArray.length) {
        geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normalArray, 3));
      } else {
        geometry.computeVertexNormals();
      }

      const indexArray = toArray(source?.index?.array);
      if (indexArray && indexArray.length >= 3) {
        geometry.setIndex(Array.from(indexArray));
      } else if (positionArray.length % 9 !== 0) {
        console.warn(`Malla ${meshNumber} omitida: índice ausente y posiciones no trianguladas.`, source);
        geometry.dispose();
        return null;
      }

      geometry.computeBoundingSphere();
      geometry.name = source.name || `Pieza ${meshNumber + 1}`;

      const baseColor = source.color && source.color.length >= 3
        ? new THREE.Color(source.color[0], source.color[1], source.color[2])
        : new THREE.Color(0xb8c4d1);
      const baseMaterial = new THREE.MeshStandardMaterial({
        color: baseColor,
        metalness: 0.12,
        roughness: 0.62,
        side: THREE.DoubleSide
      });

      // Para evitar grupos de materiales defectuosos, se conserva el color
      // general de cada malla. La geometría y todos los componentes se mantienen.
      const mesh = new THREE.Mesh(geometry, baseMaterial);
      mesh.name = geometry.name;
      return mesh;
    }

    async function loadStep() {
      try {
        if (typeof window.occtimportjs !== 'function') {
          throw new Error('No se pudo cargar occt-import-js. Comprueba la conexión y vuelve a cargar la página.');
        }

        status.innerHTML = '<span class="spinner"></span>Iniciando motor CAD…';
        const occt = await window.occtimportjs({
          locateFile: (path) => `https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/${path}`
        });

        status.innerHTML = '<span class="spinner"></span>Descargando modelo STEP…';
        const response = await fetch('./modelo.step');
        if (!response.ok) throw new Error(`No se encontró modelo.step (HTTP ${response.status}).`);
        const buffer = await response.arrayBuffer();
        if (buffer.byteLength === 0) throw new Error('El archivo modelo.step está vacío.');

        status.innerHTML = '<span class="spinner"></span>Procesando geometría y componentes…';
        await new Promise(resolve => setTimeout(resolve, 30));

        const result = occt.ReadStepFile(new Uint8Array(buffer), {
          linearUnit: 'millimeter',
          linearDeflectionType: 'bounding_box_ratio',
          linearDeflection: 0.05,
          angularDeflection: 0.5
        });

        if (!result || !result.success || !Array.isArray(result.meshes) || result.meshes.length === 0) {
          throw new Error('El motor CAD no pudo generar mallas desde el archivo STEP.');
        }

        const model = new THREE.Group();
        let loadedCount = 0;
        result.meshes.forEach((sourceMesh, index) => {
          const mesh = makeMesh(sourceMesh, index);
          if (mesh) {
            model.add(mesh);
            loadedCount++;
          }
        });

        if (loadedCount === 0) throw new Error('El STEP se leyó, pero no se encontraron mallas 3D válidas.');
        scene.add(model);

        const bounds = new THREE.Box3().setFromObject(model);
        if (bounds.isEmpty()) throw new Error('El modelo no tiene dimensiones visibles.');
        const center = bounds.getCenter(new THREE.Vector3());
        const sphere = bounds.getBoundingSphere(new THREE.Sphere());
        model.position.sub(center);

        const radius = Math.max(sphere.radius, 0.1);
        const distance = radius * 2.8;
        camera.position.set(distance, -distance, distance * 0.85);
        camera.near = Math.max(radius / 10000, 0.001);
        camera.far = radius * 100;
        camera.updateProjectionMatrix();
        controls.target.set(0, 0, 0);
        controls.minDistance = radius * 0.05;
        controls.maxDistance = radius * 40;
        controls.update();

        status.textContent = `Modelo cargado correctamente: ${loadedCount} componentes/mallas.`;
        if (loadedCount < result.meshes.length) {
          errorBox.textContent = `Se omitieron ${result.meshes.length - loadedCount} mallas con datos incompletos.`;
        }
      } catch (error) {
        status.textContent = 'No se pudo cargar el modelo.';
        errorBox.textContent = error.message || String(error);
        console.error('Error al cargar STEP:', error);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    loadStep();
  </script>
</body>
</html>

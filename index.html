<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor 3D de PCB</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #101827; color: #f8fafc; font-family: Arial, sans-serif; }
    #viewer { position: fixed; inset: 0; }
    canvas { display: block; }
    .panel {
      position: fixed; z-index: 2; top: 18px; left: 18px;
      padding: 14px 17px; max-width: min(390px, calc(100vw - 36px));
      border: 1px solid #334155; border-radius: 12px;
      background: rgba(15, 23, 42, .88); backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }
    h1 { font-size: 18px; margin: 0 0 7px; }
    #status { margin: 0; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
    .help { margin-top: 9px; color: #94a3b8; font-size: 12px; line-height: 1.5; }
    #error { color: #fca5a5; }
    .spinner { display: inline-block; width: 11px; height: 11px; margin-right: 7px;
      border: 2px solid #64748b; border-top-color: #38bdf8; border-radius: 50%;
      animation: spin .8s linear infinite; vertical-align: -1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 600px) { .panel { top: 10px; left: 10px; padding: 11px 13px; } h1 { font-size: 16px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <section class="panel">
    <h1>Modelo 3D de la PCB</h1>
    <p id="status"><span class="spinner"></span>Cargando el motor CAD y el archivo STEP…</p>
    <p class="help">Mouse: arrastrar para girar · Rueda para zoom · Clic derecho para desplazar</p>
    <p class="help" id="error"></p>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const status = document.getElementById('status');
    const errorBox = document.getElementById('error');
    const viewer = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101827);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1e9);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewer.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;

    scene.add(new THREE.AmbientLight(0xffffff, 1.15));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(1, -1, 2);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
    fillLight.position.set(-1, 1, 1);
    scene.add(fillLight);

    function makeMesh(source) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(source.attributes.position.array, 3));
      if (source.attributes.normal) {
        geometry.setAttribute('normal', new THREE.Float32BufferAttribute(source.attributes.normal.array, 3));
      } else {
        geometry.computeVertexNormals();
      }
      geometry.setIndex(Uint32Array.from(source.index.array));
      geometry.name = source.name || 'Pieza';

      const baseColor = source.color
        ? new THREE.Color(source.color[0], source.color[1], source.color[2])
        : new THREE.Color(0xb8c4d1);
      const baseMaterial = new THREE.MeshStandardMaterial({ color: baseColor, metalness: 0.12, roughness: 0.62 });
      const materials = [baseMaterial];

      if (source.brep_faces && source.brep_faces.length) {
        for (const face of source.brep_faces) {
          const color = face.color
            ? new THREE.Color(face.color[0], face.color[1], face.color[2])
            : baseColor;
          materials.push(new THREE.MeshStandardMaterial({ color, metalness: 0.1, roughness: 0.65 }));
        }
        const triangleCount = source.index.array.length / 3;
        let triangle = 0;
        let faceIndex = 0;
        while (triangle < triangleCount) {
          let last;
          let materialIndex;
          if (faceIndex >= source.brep_faces.length) {
            last = triangleCount;
            materialIndex = 0;
          } else if (triangle < source.brep_faces[faceIndex].first) {
            last = source.brep_faces[faceIndex].first;
            materialIndex = 0;
          } else {
            last = source.brep_faces[faceIndex].last + 1;
            materialIndex = faceIndex + 1;
            faceIndex++;
          }
          geometry.addGroup(triangle * 3, (last - triangle) * 3, materialIndex);
          triangle = last;
        }
      }

      const mesh = new THREE.Mesh(geometry, materials.length > 1 ? materials : baseMaterial);
      mesh.name = source.name || 'Pieza';
      return mesh;
    }

    async function loadStep() {
      try {
        if (!window.occtimportjs) throw new Error('No se pudo cargar el motor de lectura STEP. Revisa tu conexión a Internet.');
        status.innerHTML = '<span class="spinner"></span>Iniciando motor CAD…';
        const occt = await window.occtimportjs();

        status.innerHTML = '<span class="spinner"></span>Descargando modelo STEP…';
        const response = await fetch('./modelo.step');
        if (!response.ok) throw new Error('No se encontró modelo.step. Comprueba que esté en la raíz del repositorio.');
        const buffer = await response.arrayBuffer();

        status.innerHTML = '<span class="spinner"></span>Procesando geometría y componentes. Puede tardar un poco…';
        await new Promise(resolve => setTimeout(resolve, 30));
        const result = occt.ReadStepFile(new Uint8Array(buffer), null);
        if (!result || !result.success || !result.meshes || result.meshes.length === 0) {
          throw new Error('El archivo STEP no pudo convertirse en geometría visible.');
        }

        const model = new THREE.Group();
        for (const sourceMesh of result.meshes) model.add(makeMesh(sourceMesh));
        scene.add(model);

        const bounds = new THREE.Box3().setFromObject(model);
        const center = bounds.getCenter(new THREE.Vector3());
        const sphere = bounds.getBoundingSphere(new THREE.Sphere());
        model.position.sub(center);

        const radius = Math.max(sphere.radius, 1);
        const distance = radius * 2.8;
        camera.position.set(distance, -distance, distance * 0.85);
        camera.near = Math.max(radius / 10000, 0.001);
        camera.far = radius * 100;
        camera.updateProjectionMatrix();
        controls.target.set(0, 0, 0);
        controls.minDistance = radius * 0.15;
        controls.maxDistance = radius * 30;
        controls.update();

        status.textContent = `Modelo cargado: ${result.meshes.length} mallas/componentes.`;
      } catch (error) {
        status.textContent = 'No se pudo cargar el modelo.';
        errorBox.textContent = error.message || String(error);
        console.error(error);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    loadStep();
  </script>
</body>
</html>
